<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="100%" height="100%">
  <defs>
    <linearGradient id="barongFabric" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#EFE8D8" />
    </linearGradient>
    <linearGradient id="embroideryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBB285" />
      <stop offset="50%" stop-color="#E5D3B0" />
      <stop offset="100%" stop-color="#CBB285" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Shoulders & Torso Body -->
  <path d="M 120 70 Q 50 100 0 170 L 0 350 L 400 350 L 400 170 Q 350 100 280 70 Q 240 90 200 95 Q 160 90 120 70 Z" 
        fill="url(#barongFabric)" 
        stroke="#D5CBB9" 
        stroke-width="2" />

  <!-- Shoulder Seams -->
  <path d="M 120 70 Q 70 120 40 230" fill="none" stroke="#D5CBB9" stroke-width="1.5" stroke-dasharray="3,2" />
  <path d="M 280 70 Q 330 120 360 230" fill="none" stroke="#D5CBB9" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Pechera / U-Shape Embroidery Panel -->
  <path d="M 155 90 L 155 270 Q 200 295 245 270 L 245 90 Q 200 96 155 90 Z" 
        fill="#FAF6EE" 
        stroke="url(#embroideryGlow)" 
        stroke-width="3" 
        filter="url(#shadow)" />

  <!-- Inner Intricate Embroidery Details -->
  <path d="M 165 100 L 165 255 Q 200 275 235 255 L 235 100" fill="none" stroke="#C5AC7E" stroke-width="1.5" />
  <path d="M 175 110 L 175 240 Q 200 255 225 240 L 225 110" fill="none" stroke="#D8C29D" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Center Placket & Buttons -->
  <line x1="200" y1="90" x2="200" y2="280" stroke="#B89B64" stroke-width="2" />
  <circle cx="200" cy="115" r="3.5" fill="#5D4037" stroke="#FAF6EE" stroke-width="1" />
  <circle cx="200" cy="155" r="3.5" fill="#5D4037" stroke="#FAF6EE" stroke-width="1" />
  <circle cx="200" cy="195" r="3.5" fill="#5D4037" stroke="#FAF6EE" stroke-width="1" />
  <circle cx="200" cy="235" r="3.5" fill="#5D4037" stroke="#FAF6EE" stroke-width="1" />

  <!-- Traditional Calado Embroidery Patterns -->
  <g stroke="#C5AC7E" stroke-width="1" fill="none">
    <circle cx="185" cy="135" r="5" />
    <circle cx="215" cy="135" r="5" />
    <circle cx="185" cy="175" r="5" />
    <circle cx="215" cy="175" r="5" />
    <circle cx="185" cy="215" r="5" />
    <circle cx="215" cy="215" r="5" />
    <path d="M 170 135 L 230 135 M 170 175 L 230 175 M 170 215 L 230 215" stroke-dasharray="2,3" />
  </g>

  <!-- Mandarin / Standing Chinese Collar (Cut for neck insertion) -->
  <path d="M 140 70 Q 200 88 260 70 L 255 52 Q 200 68 145 52 Z" 
        fill="#FAF6EE" 
        stroke="#B89B64" 
        stroke-width="2.5" />
  <path d="M 145 52 Q 200 68 255 52" fill="none" stroke="#D5CBB9" stroke-width="1" />

  <!-- Neck Opening Void (Transparent area for subject's neck) -->
  <path d="M 142 55 Q 200 75 258 55 Q 200 40 142 55 Z" fill="transparent" />
</svg>
