<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="100%" height="100%">
  <defs>
    <linearGradient id="poloWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="collarShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Polo Torso Body -->
  <path d="M 125 70 Q 55 100 0 165 L 0 350 L 400 350 L 400 165 Q 345 100 275 70 Q 200 90 125 70 Z" 
        fill="url(#poloWhite)" 
        stroke="#CBD5E1" 
        stroke-width="1.5" />

  <!-- Center Placket -->
  <rect x="188" y="70" width="24" height="150" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  
  <!-- Placket Stitching -->
  <line x1="190" y1="72" x2="190" y2="218" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="2,2" />
  <line x1="210" y1="72" x2="210" y2="218" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="2,2" />

  <!-- Buttons -->
  <circle cx="200" cy="100" r="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
  <circle cx="200" cy="140" r="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
  <circle cx="200" cy="180" r="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />

  <!-- Left Collar Leaf -->
  <path d="M 130 65 L 180 120 L 195 72 L 140 52 Z" 
        fill="#FFFFFF" 
        stroke="#94A3B8" 
        stroke-width="1.5" 
        filter="url(#collarShadow)" />

  <!-- Right Collar Leaf -->
  <path d="M 270 65 L 220 120 L 205 72 L 260 52 Z" 
        fill="#FFFFFF" 
        stroke="#94A3B8" 
        stroke-width="1.5" 
        filter="url(#collarShadow)" />

  <!-- Collar Fold Line & Stitches -->
  <path d="M 135 62 L 175 112" fill="none" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="2,2" />
  <path d="M 265 62 L 225 112" fill="none" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="2,2" />

  <!-- Shoulder Seams -->
  <path d="M 125 70 Q 70 120 40 220" fill="none" stroke="#CBD5E1" stroke-width="1.2" />
  <path d="M 275 70 Q 330 120 360 220" fill="none" stroke="#CBD5E1" stroke-width="1.2" />
</svg>
